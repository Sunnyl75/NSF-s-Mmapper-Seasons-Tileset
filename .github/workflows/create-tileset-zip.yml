name: Create Tileset Zip

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name'
        required: false
        default: 'MUME-Shimrod Tileset'

permissions:
  contents: write

jobs:
  create-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip file
        run: |
          zip -r "mume-shimrod-tileset.zip" "MUME-Shimrod tileset for mMapper"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mume-shimrod-tileset
          path: mume-shimrod-tileset.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tileset-${{ github.run_number }}
          name: ${{ github.event.inputs.release_name }} #${{ github.run_number }}
          files: mume-shimrod-tileset.zip
          body: |
            Automatically generated tileset zip.

            Contents:
            - Seasonal tilesets
            - Cover image
            - README documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
